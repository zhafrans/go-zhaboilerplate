version: "3.7"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: go-zhaboilerplate:dev
    container_name: go_zhaboilerplate_api_dev
    ports:
      - "9090:9090"
    volumes:
      - .:/app
    environment:
      - SERVER_ADDRESS=:9090
      - CONTEXT_TIMEOUT=5
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_USER=user
      - DATABASE_PASS=password
      - DATABASE_NAME=go_zhaboilerplate
      - JWT_SECRET=boilerplate-super-secret-key-change-in-production
      - JWT_EXPIRY_HOURS=24
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.3
    container_name: go_zhaboilerplate_mysql_dev
    command: mysqld --user=root
    volumes:
      - ./users.sql:/docker-entrypoint-initdb.d/init.sql
      - go_zhaboilerplate_mysql_dev_data:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=go_zhaboilerplate
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - MYSQL_ROOT_PASSWORD=root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  go_zhaboilerplate_mysql_dev_data:
